<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>TitoPay Admin Preview</title>
  <link rel="icon" href="../assets/titopay-official-logo.png?v=20260716-only-logo" type="image/png">
  <link rel="apple-touch-icon" href="../assets/titopay-official-logo.png?v=20260716-only-logo">
  <style>
    :root { --navy:#010a3f; --blue:#0b6fff; --line:#dbe5f1; --muted:#52667f; --bg:#f6fbff; }
    * { box-sizing:border-box; }
    body { min-height:100vh; margin:0; display:grid; place-items:center; padding:24px; font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; color:var(--navy); background:linear-gradient(180deg,#fff,var(--bg)); }
    main { width:min(520px,100%); padding:26px; border:1px solid var(--line); border-radius:18px; background:#fff; box-shadow:0 18px 42px rgba(6,43,120,.1); }
    img { width:210px; height:58px; object-fit:contain; display:block; margin-bottom:18px; }
    .label { color:var(--blue); font-size:12px; font-weight:900; letter-spacing:.7px; text-transform:uppercase; }
    h1 { margin:8px 0 10px; font-size:30px; line-height:1.08; }
    p { margin:0 0 16px; color:var(--muted); line-height:1.55; }
    a { min-height:44px; display:inline-flex; align-items:center; justify-content:center; border-radius:10px; padding:0 16px; background:var(--blue); color:#fff; font-weight:850; text-decoration:none; }
    .secondary { margin-left:8px; border:1px solid var(--line); background:#fff; color:var(--navy); }
    @media (max-width:520px) { main { padding:22px; } a { width:100%; margin:0 0 10px; } .secondary { margin-left:0; } }
  </style>
</head>
<body>
  <main>
    <img src="../assets/titopay-official-logo.png" alt="TitoPay">
    <span class="label">Admin Preview</span>
    <h1>Admin runs on PHP hosting.</h1>
    <p>The live secure dashboard opens on Afrihost at <strong>https://titopay.co.za/admin/</strong>. This local preview server shows marketing pages only because PHP is not installed here.</p>
    <a href="../">Main site</a>
    <a class="secondary" href="index.php">PHP file</a>
  </main>
</body>
</html>
