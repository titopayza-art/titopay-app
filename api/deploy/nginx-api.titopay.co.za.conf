log_format titopay_api '$remote_addr - $remote_user [$time_local] '
                       '"$request_method $uri $server_protocol" $status $body_bytes_sent '
                       '"$http_referer" "$http_user_agent" request_id=$request_id '
                       'request_time=$request_time upstream_connect_time=$upstream_connect_time '
                       'upstream_header_time=$upstream_header_time upstream_response_time=$upstream_response_time';

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream titopay_api {
    server 127.0.0.1:8110;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name api.titopay.co.za;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.titopay.co.za;

    # Configure certificate paths through Certbot or the hosting provider.
    ssl_certificate /etc/letsencrypt/live/api.titopay.co.za/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.titopay.co.za/privkey.pem;

    access_log /var/log/nginx/titopay-api-access.log titopay_api;
    error_log /var/log/nginx/titopay-api-error.log warn;
    client_max_body_size 1m;
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types application/json application/javascript text/css text/plain image/svg+xml;

    location = /v1/chat/socket {
        proxy_pass http://titopay_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header Origin $http_origin;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 65s;
        proxy_send_timeout 65s;
        proxy_buffering off;
    }

    location = /api/chat/socket {
        proxy_pass http://titopay_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header Origin $http_origin;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 65s;
        proxy_send_timeout 65s;
        proxy_buffering off;
    }

    location / {
        proxy_pass http://titopay_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $request_id;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
        proxy_buffering on;
        proxy_buffers 16 16k;
        proxy_busy_buffers_size 32k;
    }
}
