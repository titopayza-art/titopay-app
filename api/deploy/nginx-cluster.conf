# Routing for the clustered API.
#
# One rule matters: /v1/chat/socket goes to the single chat instance, everything
# else goes to the clustered API. Chat keeps its open sockets in process memory,
# so a customer on one worker is invisible to the others — without this split an
# agent's reply simply never arrives, with no error anywhere.
#
# Merge the two location blocks into the existing api.titopay.co.za server
# block. The upstreams and the WebSocket map go at http level.
#
# Verify after reloading:
#   curl -s -o /dev/null -w '%{http_code}\n' https://api.titopay.co.za/v1/health
#   then open the PWA, start a chat, and reply from the admin console.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream titopay_api {
    # The clustered workers share one port; Node's cluster module balances
    # across them, so nginx needs only this one entry.
    server 127.0.0.1:8080;
    keepalive 64;
}

upstream titopay_chat {
    # Must match CHAT_PORT in deploy/ecosystem.config.cjs.
    server 127.0.0.1:8081;
    keepalive 16;
}

# ---------------------------------------------------------------------------
# Inside: server { server_name api.titopay.co.za; ... }
# ---------------------------------------------------------------------------

# Chat sockets — the single instance, never the cluster. This block must come
# before the general one so it wins.
location = /v1/chat/socket {
    proxy_pass         http://titopay_chat;
    proxy_http_version 1.1;
    proxy_set_header   Upgrade $http_upgrade;
    proxy_set_header   Connection $connection_upgrade;
    proxy_set_header   Host $host;
    proxy_set_header   X-Real-IP $remote_addr;
    # Cloudflare's own header is passed through untouched. The API believes it
    # only when the connection genuinely came from a Cloudflare address, so it
    # must arrive intact rather than be rewritten here.
    proxy_set_header   CF-Connecting-IP $http_cf_connecting_ip;

    # A chat socket is idle between messages; the default 60s would close it.
    proxy_read_timeout  3600s;
    proxy_send_timeout  3600s;
    proxy_buffering     off;
}

# Everything else — the clustered API.
location / {
    proxy_pass         http://titopay_api;
    proxy_http_version 1.1;
    proxy_set_header   Connection "";
    proxy_set_header   Host $host;
    proxy_set_header   X-Real-IP $remote_addr;
    proxy_set_header   CF-Connecting-IP $http_cf_connecting_ip;

    proxy_connect_timeout 5s;
    proxy_read_timeout    65s;
    proxy_send_timeout    65s;
}
