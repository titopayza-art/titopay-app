# TicketRoom on nginx + PHP-FPM (your own server). The same rules as the
# .htaccess files, which nginx does not read.
#
# Install: copy to /etc/nginx/sites-available/ticketroom, link it into
# sites-enabled, set the two paths below, then `nginx -t && systemctl reload nginx`.
# setup-ubuntu.sh does all of this.

# Request limits per visitor IP (the real one, behind Cloudflare: see
# cloudflare-ips.conf). API calls get a burst for page loads; sign-in and
# payment endpoints also have their own limits inside the app.
limit_req_zone  $binary_remote_addr zone=tr_api:20m  rate=20r/s;
limit_req_zone  $binary_remote_addr zone=tr_page:20m rate=30r/s;
limit_conn_zone $binary_remote_addr zone=tr_conn:20m;

server {
    listen 80;
    listen [::]:80;
    server_name ticketroom.co.za www.ticketroom.co.za;
    location /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / { return 308 https://ticketroom.co.za$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.ticketroom.co.za;
    ssl_certificate     /etc/letsencrypt/live/ticketroom.co.za/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ticketroom.co.za/privkey.pem;
    return 301 https://ticketroom.co.za$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name ticketroom.co.za;

    root /var/www/ticketroom/public_html;      # the zip's contents
    index index.html index.php;

    ssl_certificate     /etc/letsencrypt/live/ticketroom.co.za/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ticketroom.co.za/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:tr_ssl:20m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    server_tokens off;
    client_max_body_size 12m;                  # uploads are capped lower in the app
    client_body_timeout 15s;
    client_header_timeout 15s;
    keepalive_timeout 30s;
    send_timeout 30s;
    limit_conn tr_conn 60;

    gzip on;
    gzip_types text/css text/plain text/csv application/javascript text/javascript application/json image/svg+xml application/manifest+json;

    # Security headers on every response (PHP adds its own to API replies).
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header X-Permitted-Cross-Domain-Policies "none" always;

    error_page 404 /404.html;

    # Never served: private folders, the server kit, hidden files, databases,
    # dumps, logs, settings and notes.
    location ~ ^/(data|tr-app|tr-data|server|ticketroom-data)(/|$) { return 403; }
    location ~ /\.(?!well-known/) { return 403; }
    location ~* \.(md|sql|sqlite|sqlite-wal|sqlite-shm|zip|tar|gz|bak|log|ini|sh|conf|cnf)$ { return 403; }
    location = /START-HERE.txt { return 403; }
    location = /maintenance.on { return 403; }
    # PHP files that are not pages are never run directly.
    location ~ ^/api/(?!index\.php$).*\.php$ { return 403; }

    # The API: everything under /api and /media goes to api/index.php.
    location ^~ /api/ {
        limit_req zone=tr_api burst=60 nodelay;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/api/index.php;
        fastcgi_param SCRIPT_NAME /api/index.php;
        fastcgi_param HTTP_AUTHORIZATION $http_authorization;
        fastcgi_pass unix:/run/php/ticketroom.sock;
        fastcgi_read_timeout 60s;
    }
    location = /api { return 308 /api/; }
    location ^~ /media/ {
        limit_req zone=tr_api burst=60 nodelay;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/api/index.php;
        fastcgi_param SCRIPT_NAME /api/index.php;
        fastcgi_pass unix:/run/php/ticketroom.sock;
    }

    # The few PHP pages (setup, password links, the deploy check, maintenance).
    location ~ ^/(index|setup|set-password|deploy-check)\.php$ {
        limit_req zone=tr_page burst=20 nodelay;
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/ticketroom.sock;
    }

    # Old addresses.
    rewrite ^/organiser(/.*)?$ /organisers$1 permanent;
    rewrite ^/(privacy|cookies|terms)/?$ /legal/$1 permanent;
    rewrite ^/legal/refunds/?$ /legal/terms permanent;
    rewrite ^/browse/?$ / permanent;
    # /about.html and /index.html read as /about and /.
    if ($request_uri ~* "^/(.*/)?index(\.html)?(\?.*)?$") { return 301 /$1$3; }
    if ($request_uri ~* "^/(.+?)\.html(\?.*)?$") { return 301 /$1$2; }

    location / {
        limit_req zone=tr_page burst=60 nodelay;
        # Maintenance: pages show the notice, except the staff tools.
        if (-f $document_root/maintenance.on) { set $tr_maint 1; }
        if ($uri ~ ^/(admin|contact|scan|pos)$) { set $tr_maint 0; }
        if ($tr_maint = 1) { rewrite ^/([^.]*|.*\.html)$ /index.php last; }
        rewrite ^/events/[^/]+(/tickets)?$ /event.html last;
        rewrite ^/orders/[^/]+$ /order.html last;
        try_files $uri $uri.html $uri/ =404;
    }

    location ~ ^/(admin|login-otp|order|pay|pass|signin|organisers|pos)\.html$ {
        add_header Cache-Control "no-store, max-age=0" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self' https://www.payfast.co.za https://sandbox.payfast.co.za; frame-ancestors 'none'" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "DENY" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        try_files $uri =404;
    }
    location ~* \.html$ {
        add_header Cache-Control "no-cache, must-revalidate" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self' https://www.payfast.co.za https://sandbox.payfast.co.za; frame-ancestors 'none'" always;
        add_header Permissions-Policy "camera=(self), microphone=(), geolocation=(self), payment=()" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "DENY" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        try_files $uri =404;
    }
    location ~* \.(css|js|webmanifest)$ { add_header Cache-Control "no-cache, must-revalidate" always; add_header X-Content-Type-Options "nosniff" always; try_files $uri =404; }
    location ~* \.(png|jpg|jpeg|webp|svg|ico)$ { add_header Cache-Control "public, no-cache" always; add_header X-Content-Type-Options "nosniff" always; try_files $uri =404; }
    location = /sw.js { add_header Cache-Control "no-cache" always; add_header X-Content-Type-Options "nosniff" always; try_files $uri =404; }
}
