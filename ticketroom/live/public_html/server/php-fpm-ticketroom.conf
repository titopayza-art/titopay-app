; TicketRoom PHP-FPM pool. Copy to /etc/php/8.3/fpm/pool.d/ticketroom.conf.
; Its own Linux user, its own socket, and PHP locked down for this site.
[ticketroom]
user = ticketroom
group = ticketroom
listen = /run/php/ticketroom.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660

; Workers: about 60 MB each. On a 4 CPU / 8 GB server, 80 workers leave
; room for MySQL. setup-ubuntu.sh sizes this from the server's memory.
pm = dynamic
pm.max_children = 80
pm.start_servers = 16
pm.min_spare_servers = 8
pm.max_spare_servers = 24
pm.max_requests = 2000
request_terminate_timeout = 120s
request_slowlog_timeout = 5s
slowlog = /var/log/php-ticketroom-slow.log
catch_workers_output = yes
security.limit_extensions = .php

; Hardening: no shell access from PHP (backups use proc_open for mysqldump
; only), no remote includes, files only inside the site and its data folder.
php_admin_value[disable_functions] = exec,shell_exec,system,passthru,popen,pcntl_exec,pcntl_fork,dl,show_source,highlight_file,phpinfo,posix_kill,posix_setuid,posix_setgid
php_admin_value[open_basedir] = /var/www/ticketroom/:/tmp/
php_admin_flag[allow_url_include] = off
php_admin_flag[allow_url_fopen] = on
php_admin_flag[expose_php] = off
php_admin_flag[display_errors] = off
php_admin_flag[log_errors] = on
php_admin_value[error_log] = /var/www/ticketroom/ticketroom-data/php-errors.log
php_admin_value[upload_max_filesize] = 10M
php_admin_value[post_max_size] = 12M
php_admin_value[max_execution_time] = 60
php_admin_value[memory_limit] = 256M
php_admin_value[session.cookie_httponly] = 1
php_admin_value[session.cookie_secure] = 1
php_admin_value[session.cookie_samesite] = Lax
php_admin_value[session.use_strict_mode] = 1
; OPcache: compiled code stays in memory; files change only on deploy.
php_admin_flag[opcache.enable] = on
php_admin_value[opcache.memory_consumption] = 192
php_admin_value[opcache.max_accelerated_files] = 20000
php_admin_flag[opcache.validate_timestamps] = on
php_admin_value[opcache.revalidate_freq] = 60
