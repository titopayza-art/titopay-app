# Blocks addresses that keep failing: SSH logins and repeated 403/429 replies
# from the site. Copy to /etc/fail2ban/jail.d/ticketroom.conf.
[sshd]
enabled = true
maxretry = 4
findtime = 10m
bantime = 1h

[nginx-limit-req]
enabled = true
port = http,https
logpath = /var/log/nginx/error.log
maxretry = 20
findtime = 1m
bantime = 15m

[nginx-botsearch]
enabled = true
port = http,https
logpath = /var/log/nginx/access.log
maxretry = 10
bantime = 1h
