<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#ffffff">
    <title>Verify your TitoPay email</title>
    <link rel="icon" href="../assets/favicon.png?v=165">
    <style>
      :root { color-scheme: light; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #071b43; background: #f4f7fc; }
      * { box-sizing: border-box; }
      body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: max(24px, env(safe-area-inset-top)) 20px max(24px, env(safe-area-inset-bottom)); background: linear-gradient(180deg, #fff 0, #f2f6fc 100%); }
      main { width: min(100%, 560px); padding: 38px 30px; border: 1px solid #dbe6f5; border-radius: 28px; background: #fff; box-shadow: 0 20px 55px rgba(16, 43, 87, .12); text-align: center; }
      img { width: min(250px, 70%); height: auto; margin-bottom: 30px; }
      .eyebrow { margin: 0 0 10px; color: #1457ff; font-size: 14px; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; }
      h1 { margin: 0; font-size: clamp(28px, 7vw, 40px); line-height: 1.08; }
      p { color: #5d6d8a; font-size: 17px; line-height: 1.55; }
      .status { margin: 26px 0; padding: 18px; border-radius: 18px; background: #eef4ff; color: #17335f; font-weight: 650; }
      .status.success { background: #eaf9f1; color: #14633c; }
      .status.error { background: #fff0f0; color: #9e2828; }
      a { display: inline-flex; min-height: 52px; align-items: center; justify-content: center; padding: 0 24px; border-radius: 15px; background: #1457ff; color: #fff; font-weight: 800; text-decoration: none; }
      a[hidden] { display: none; }
    </style>
    <script src="./verify-email.js?v=227" defer></script>
  </head>
  <body>
    <main aria-labelledby="verification-title">
      <img src="../assets/titopay-logo.png" alt="TitoPay">
      <p class="eyebrow">Email verification</p>
      <h1 id="verification-title">Confirming your email</h1>
      <p id="verification-copy">Please wait while TitoPay securely verifies this email address.</p>
      <div class="status" id="verification-status" role="status" aria-live="polite">Verifying…</div>
      <a id="open-titopay" href="../" hidden>Open TitoPay</a>
    </main>
  </body>
</html>
