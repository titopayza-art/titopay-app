<!doctype html>
<html lang="en-ZA">
  <head>
    <meta charset="utf-8">
    <!-- Every asset below is referenced relatively (./app.min.js). When the app
         is opened at a deep link such as /events/<slug> those would resolve
         against /events/ and 404. This pins them to the site root so a shared
         event page loads the app instead of a blank shell. Same-origin, so the
         CSP base-uri 'self' allows it. -->
    <base href="/">
    <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
    <meta name="theme-color" content="#0a4dff">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="referrer" content="no-referrer">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src 'self' https://api.titopay.co.za wss://api.titopay.co.za; img-src 'self' data: blob:; media-src 'self' blob:; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; worker-src 'self'">
    <meta name="description" content="TitoPay. Smart Payments. Simplified.">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="TitoPay">
    <title>TitoPay App</title>
    <link rel="manifest" href="./manifest.webmanifest?v=193">
    <link rel="icon" type="image/png" href="./assets/favicon.png?v=165">
    <link rel="apple-touch-icon" href="./assets/apple-touch-icon.png?v=165">
    <!-- Without a startup image, iOS shows a white flash between tapping the
         icon and first paint - the single most website-feeling moment a PWA
         has. iOS only uses an image whose size matches the device exactly. -->
    <link rel="apple-touch-startup-image" href="./assets/splash-1170x2532.png?v=165"
          media="(device-width: 390px) and (device-height: 844px) and (-webkit-device-pixel-ratio: 3)">
    <link rel="preload" href="./assets/titopay-logo.png" as="image" fetchpriority="high">
    <link rel="stylesheet" href="./styles.min.css?v=392">
    <script src="./app.min.js?v=392" defer></script>
    <script src="./notification-routing-fix.js?v=1" defer></script>
  </head>
  <body>
    <div id="app" class="app-shell" aria-live="polite">
      <main class="launch-screen">
        <img src="./assets/titopay-logo.png" alt="TitoPay" class="launch-logo" width="512" height="512" fetchpriority="high">
        <div class="loader" aria-label="Loading"></div>
        <p>Smart Payments. Simplified.</p>
        <footer class="launch-legal" aria-label="TitoPay legal and payment partner">
          <span>TitoPay (Pty) Ltd | Reg No: 2026/399418/07</span>
          <span>Powered by Peach Payments (PCI DSS Level 1 Certified)</span>
        </footer>
      </main>
    </div>
    <noscript>
      <main class="noscript">
        <h1>TitoPay needs JavaScript</h1>
        <p>Please enable JavaScript to use the TitoPay app.</p>
      </main>
    </noscript>
  </body>
</html>
