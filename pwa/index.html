<!doctype html>
<html lang="en-ZA">
  <head>
    <meta charset="utf-8">
    <!-- Every asset below is referenced relatively (./app.min.js). When the app
         is opened at a deep link such as /events/<slug> those would resolve
         against /events/ and 404. This pins them to the site root so a shared
         event page loads the app instead of a blank shell. Same-origin, so the
         CSP base-uri 'self' allows it. -->
    <base href="/">
    <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
    <meta name="theme-color" content="#0a4dff">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="referrer" content="no-referrer">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src 'self' https://api.titopay.co.za wss://api.titopay.co.za; img-src 'self' data: blob:; media-src 'self' blob:; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; worker-src 'self'">
    <meta name="description" content="TitoPay. Smart Payments. Simplified.">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="TitoPay">
    <title>TitoPay App</title>
    <link rel="manifest" href="./manifest.webmanifest?v=193">
    <link rel="icon" type="image/png" href="./assets/favicon.png?v=165">
    <link rel="apple-touch-icon" href="./assets/apple-touch-icon.png?v=165">
    <!-- Without a startup image, iOS shows a white flash between tapping the
         icon and first paint - the single most website-feeling moment a PWA
         has. iOS only uses an image whose size matches the device EXACTLY, so
         one image covered one phone and every other device still flashed; the
         one that was here had also been truncated in the writing and would not
         decode at all. Regenerate with verification/make-splash-screens.py. -->
    <link rel="apple-touch-startup-image" href="./assets/splash-750x1334.png?v=445"
          media="(device-width: 375px) and (device-height: 667px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)">
    <link rel="apple-touch-startup-image" href="./assets/splash-1242x2208.png?v=445"
          media="(device-width: 414px) and (device-height: 736px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)">
    <link rel="apple-touch-startup-image" href="./assets/splash-1125x2436.png?v=445"
          media="(device-width: 375px) and (device-height: 812px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)">
    <link rel="apple-touch-startup-image" href="./assets/splash-828x1792.png?v=445"
          media="(device-width: 414px) and (device-height: 896px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)">
    <link rel="apple-touch-startup-image" href="./assets/splash-1242x2688.png?v=445"
          media="(device-width: 414px) and (device-height: 896px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)">
    <link rel="apple-touch-startup-image" href="./assets/splash-1170x2532.png?v=445"
          media="(device-width: 390px) and (device-height: 844px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)">
    <link rel="apple-touch-startup-image" href="./assets/splash-1284x2778.png?v=445"
          media="(device-width: 428px) and (device-height: 926px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)">
    <link rel="apple-touch-startup-image" href="./assets/splash-1179x2556.png?v=445"
          media="(device-width: 393px) and (device-height: 852px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)">
    <link rel="apple-touch-startup-image" href="./assets/splash-1290x2796.png?v=445"
          media="(device-width: 430px) and (device-height: 932px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)">
    <link rel="apple-touch-startup-image" href="./assets/splash-1206x2622.png?v=445"
          media="(device-width: 402px) and (device-height: 874px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)">
    <link rel="apple-touch-startup-image" href="./assets/splash-1320x2868.png?v=445"
          media="(device-width: 440px) and (device-height: 956px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)">
    <link rel="preload" href="./assets/titopay-logo.png" as="image" fetchpriority="high">
    <!-- CRITICAL SPLASH CSS, inline so the branded launch screen paints on the
         very first frame. The full stylesheet (styles.min.css, ~248KB) is
         render-blocking: until it downloaded, a cold or slow launch showed a
         blank WHITE screen instead of the splash. These few rules style the
         launch screen (logo, spinner, tagline, legal) from the HTML itself, so
         there is never a white frame; the full stylesheet then loads without
         blocking (head-boot.js) and takes over. Values mirror styles.min.css
         exactly, so nothing shifts when it arrives. -->
    <style>
      html{background:#eef4fe}
      body{margin:0;background:#eef4fe;color:#10203f;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
      .launch-screen{min-height:100vh;min-height:100svh;min-height:100dvh;display:grid;place-items:center;align-content:center;gap:20px;padding:calc(28px + env(safe-area-inset-top,0px)) 28px calc(28px + env(safe-area-inset-bottom,0px));text-align:center}
      .launch-logo{width:min(186px,49vw);height:auto;display:block;border:0}
      .loader{width:36px;height:36px;border-radius:999px;border:4px solid #eaf1ff;border-top-color:#0a4dff;animation:spin .9s linear infinite}
      .launch-legal{position:fixed;left:22px;right:22px;bottom:calc(18px + env(safe-area-inset-bottom,0px));display:grid;gap:3px;color:#62708a;font-size:.72rem;line-height:1.35;text-align:center}
      @keyframes spin{to{transform:rotate(360deg)}}
      @media (prefers-reduced-motion:reduce){.loader{animation:none}}
    </style>
    <script src="./head-boot.js?v=493"></script>
    <noscript><link rel="stylesheet" href="./styles.min.css?v=493"></noscript>
    <script src="./app.min.js?v=493" defer></script>
    <script src="./notification-routing-fix.js?v=1" defer></script>
  </head>
  <body>
    <div id="app" class="app-shell" aria-live="polite">
      <main class="launch-screen">
        <img src="./assets/titopay-logo.png" alt="TitoPay" class="launch-logo" width="512" height="512" fetchpriority="high">
        <div class="loader" aria-label="Loading"></div>
        <p>Smart Payments. Simplified.</p>
        <footer class="launch-legal" aria-label="TitoPay legal and payment partner">
          <span>TitoPay (Pty) Ltd | Reg No: 2026/399418/07</span>
          <span>Powered by Peach Payments (PCI DSS Level 1 Certified)</span>
        </footer>
      </main>
    </div>
    <noscript>
      <main class="noscript">
        <h1>TitoPay needs JavaScript</h1>
        <p>Please enable JavaScript to use the TitoPay app.</p>
      </main>
    </noscript>
  </body>
</html>
