# Automated dependency-update PRs. Dependabot only opens pull requests — it
# never touches the running service — so it cannot affect production or a deploy.
# Each PR still runs through CI (including the npm-audit gate) before it can merge.
version: 2
updates:
  # Backend API — the shipped dependencies.
  - package-ecosystem: "npm"
    directory: "/api"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      api-dependencies:
        patterns: ["*"]
    commit-message:
      prefix: "deps(api)"

  # Root tooling (Playwright test harness).
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "deps"

  # The GitHub Actions the workflow pins.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "ci"
