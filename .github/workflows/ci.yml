name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # Syntax gate first: it is instant and catches the majority of mistakes
      # before a browser is ever launched.
      - name: Check app syntax
        run: node --check app.js && node --check service-worker.js

      - name: Check version consistency
        run: node tests/check-version.js

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Serve the app
        run: |
          python3 -m http.server 8899 &
          for i in $(seq 1 20); do
            curl -sf http://127.0.0.1:8899/index.html >/dev/null && break
            sleep 1
          done

      - name: Run browser suites
        run: npm test

      - name: Upload screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: tests/artifacts/
          if-no-files-found: ignore

  # Supply-chain gate: install the backend from its locked tree and fail on a
  # high or critical advisory. Runs alongside verify; neither blocks the other.
  dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install API dependencies (locked)
        working-directory: api
        run: npm ci --omit=dev --no-audit --no-fund
      - name: Audit API dependencies
        working-directory: api
        run: npm audit --omit=dev --audit-level=high

  # Secret gate: scan the working tree for committed credentials. Configured by
  # .gitleaks.toml; the allowlist there keeps name-only templates and fixtures
  # from tripping it, so it fails only on a genuine leak.
  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install gitleaks
        run: |
          VERSION=8.21.2
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz" \
            | tar -xz gitleaks
          sudo mv gitleaks /usr/local/bin/gitleaks
      - name: Scan for secrets
        run: gitleaks detect --no-git --config .gitleaks.toml --redact --verbose
