name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # Syntax gate first: it is instant and catches the majority of mistakes
      # before a browser is ever launched.
      - name: Check app syntax
        run: node --check app.js && node --check service-worker.js

      - name: Check version consistency
        run: node tests/check-version.js

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Serve the app
        run: |
          python3 -m http.server 8899 &
          for i in $(seq 1 20); do
            curl -sf http://127.0.0.1:8899/index.html >/dev/null && break
            sleep 1
          done

      - name: Run browser suites
        run: npm test

      - name: Upload screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: tests/artifacts/
          if-no-files-found: ignore
