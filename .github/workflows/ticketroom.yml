name: TicketRoom

# Scoped to the isolated TicketRoom package. TitoPay's own CI (ci.yml) is unchanged.
on:
  push:
    paths: ["ticketroom/**", ".github/workflows/ticketroom.yml"]
  pull_request:
    paths: ["ticketroom/**", ".github/workflows/ticketroom.yml"]

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ticketroom
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ticketroom
          POSTGRES_PASSWORD: ticketroom_dev
          POSTGRES_DB: ticketroom
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ticketroom" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci --no-audit --no-fund
      - run: npm run check
      - run: npm test
      - name: Browser walkthrough
        run: |
          npx playwright install --with-deps chromium
          npm run migrate && npm run seed
          RATE_LIMIT_DISABLED=true node server.js &
          for i in $(seq 1 20); do curl -sf http://127.0.0.1:8080/api/health >/dev/null && break; sleep 1; done
          npm run test:ui
      - name: Dependency audit (report only)
        run: npm audit --omit=dev || true
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: ticketroom-ui-screenshots
          path: ticketroom/tests-ui/artifacts/
          if-no-files-found: ignore
