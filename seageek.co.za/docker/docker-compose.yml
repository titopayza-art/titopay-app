# Local or single-server deployment. For more traffic, run more "web" replicas behind a load balancer,
# point SG_DB_HOST at a managed MySQL, and keep exactly one "worker".
services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: seageek
      MYSQL_USER: seageek
      MYSQL_PASSWORD: ${SG_DB_PASS:?set SG_DB_PASS}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD}
    volumes: [dbdata:/var/lib/mysql]
    restart: unless-stopped

  web:
    build: { context: .., dockerfile: docker/Dockerfile }
    env_file: .env
    environment: { SG_DB_DRIVER: mysql, SG_DB_HOST: db, SG_DB_NAME: seageek, SG_DB_USER: seageek }
    ports: ["8080:80"]
    depends_on: [db]
    restart: unless-stopped

  worker:
    build: { context: .., dockerfile: docker/Dockerfile }
    env_file: .env
    environment: { SG_DB_DRIVER: mysql, SG_DB_HOST: db, SG_DB_NAME: seageek, SG_DB_USER: seageek }
    command: ["php", "/var/www/html/cli.php", "worker"]
    depends_on: [db]
    restart: unless-stopped

volumes:
  dbdata:
