# nginx + PHP-FPM (VPS or cloud VM). Web root is the project folder.
server {
    listen 80;
    server_name seageek.co.za www.seageek.co.za;
    return 301 https://www.seageek.co.za$request_uri;
}

server {
    listen 443 ssl http2;
    server_name www.seageek.co.za;
    root /var/www/seageek;
    index index.php;

    ssl_certificate     /etc/letsencrypt/live/www.seageek.co.za/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.seageek.co.za/privkey.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    client_max_body_size 12m;

    # Never serve code, data or dependencies
    location ~ ^/(app|storage|vendor|docker|guides)/ { deny all; }
    location ~ ^/(cli\.php|composer\.(json|lock)|.*\.md)$ { deny all; }

    location /assets/ { expires 7d; try_files $uri =404; }

    location / { try_files $uri /index.php$is_args$args; }

    location = /index.php {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_param HTTP_AUTHORIZATION $http_authorization;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
    }
    location ~ \.php$ { deny all; }
}
